[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-unusual-python"
version = "0.1.0"
description = "Independent Python service for stock_unusual realtime market events"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<8",
  "PyMySQL>=1.1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
stock-unusual-web = "stock_unusual.web:main"
stock-unusuald = "stock_unusual.scanner:main"
stock-name-sync = "stock_unusual.names:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["stock_unusual*"]
